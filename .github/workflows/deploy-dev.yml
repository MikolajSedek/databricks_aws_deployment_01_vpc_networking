name: Deploy Dev Environment

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.pre-commit-config.yaml'
      - '.tflint.hcl'
      - '.trivyignore'
      - '.github/workflows/deploy-dev.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.pre-commit-config.yaml'
      - '.tflint.hcl'
      - '.trivyignore'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      auto_apply:
        description: 'Auto-apply after plan approval (if GitHub Environment protection rules allow)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.16.3'
  TFLINT_VERSION: 'latest'
  TRIVY_VERSION: 'latest'
  TERRAFORM_DOCS_VERSION: 'v0.24.0'
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
  AWS_PROFILE: 'production-admin'
  TF_WORKING_DIR: 'environments/dev'
  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'eu-central-1' }}
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_environment: 'dev'
  TF_VAR_profile: 'production-admin'

jobs:
  # ============================================================================
  # STEP 1: PRE-COMMIT CHECKS
  # Runs code formatting, linting (tflint), security scanning (trivy, checkov, gitleaks),
  # and documentation checks (terraform-docs).
  # ============================================================================
  precommit:
    name: Pre-commit Quality & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup uv using official Astral GitHub plugin (v10.2.0)
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      # Setup Terraform using official HashiCorp GitHub plugin (v4)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Setup TFLint using official GitHub plugin (v6)
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize TFLint Plugins
        run: tflint --init --config .tflint.hcl

      # Setup Trivy using Aqua Security GitHub plugin (v0.3.1)
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install terraform-docs binary into PATH using official GitHub release installer (v3)
      - name: Setup terraform-docs
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: terraform-docs/terraform-docs
          tag: ${{ env.TERRAFORM_DOCS_VERSION }}
          cache: enable

      # Install Python virtualenv dependencies (checkov & pre-commit from pyproject.toml)
      - name: Install dependencies with uv
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      # Run pre-commit checks
      - name: Run precommit
        run: |
          uv run pre-commit run --all-files


  # ============================================================================
  # STEP 2: TERRAFORM VALIDATE & PLAN
  # Validates syntax, generates the execution plan, and caches the plan artifact.
  # ============================================================================
  plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: [precommit]
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup Terraform using official HashiCorp GitHub plugin (v4)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS credentials environment variables (v6)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Set up named AWS CLI profile required by backend.tf and providers.tf
      - name: Setup Named AWS Profile
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" --profile "${{ env.AWS_PROFILE }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" --profile "${{ env.AWS_PROFILE }}"
          aws configure set region "${{ env.AWS_REGION }}" --profile "${{ env.AWS_PROFILE }}"
          if [ -n "${{ secrets.AWS_SESSION_TOKEN }}" ]; then
            aws configure set aws_session_token "${{ secrets.AWS_SESSION_TOKEN }}" --profile "${{ env.AWS_PROFILE }}"
          fi

      # Cache Terraform plugins and providers (.terraform directory) (v6)
      - name: Cache Terraform Providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      # Upload and cache the binary plan file and text summary as workflow artifacts (v7)
      - name: Cache & Save Terraform Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          retention-days: 5

      # Attach plan summary to PR if running on pull request
      - name: Add Plan Summary to Job Summary
        run: |
          echo "### Terraform Plan Summary (\`dev\`)" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat tfplan.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STEP 3: TERRAFORM APPLY
  # Gated by GitHub Environment manual approval ("dev" environment in GitHub UI).
  # ============================================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan]
    # Restrict automatic apply to push on default branch or explicit workflow_dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # GitHub Environment: Configure "Required reviewers" in GitHub Repo Settings -> Environments -> dev
    # This pauses the workflow and requires an extra user action (click "Review deployments" -> Approve) in GitHub UI.
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup Terraform using official HashiCorp GitHub plugin (v4)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS credentials environment variables (v6)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Set up named AWS CLI profile required by backend.tf and providers.tf
      - name: Setup Named AWS Profile
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" --profile "${{ env.AWS_PROFILE }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" --profile "${{ env.AWS_PROFILE }}"
          aws configure set region "${{ env.AWS_REGION }}" --profile "${{ env.AWS_PROFILE }}"
          if [ -n "${{ secrets.AWS_SESSION_TOKEN }}" ]; then
            aws configure set aws_session_token "${{ secrets.AWS_SESSION_TOKEN }}" --profile "${{ env.AWS_PROFILE }}"
          fi

      # Restore cached Terraform plugins (.terraform directory) (v6)
      - name: Restore Terraform Providers Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}

      - name: Terraform Init
        run: terraform init

      # Download the cached plan file generated in Step 2 (v8)
      - name: Download Cached Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: dev-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan
